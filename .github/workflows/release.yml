name: release

# After a merge to main that changes what projects receive (skills/, baselines/, mods/, orion.sh), tags the next version
# v<major.minor.patch>, sized by the Conventional Commit types of the pull requests since the last release
# (.github/scripts/release-version.sh holds the rules). The session-start check of every project reads these tags
# and offers an update only when one is higher than the version the project installed, so a merge that changes
# nothing a project receives (and so tags nothing) is never offered.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag the next version
        run: |
          tags="$(bash .github/scripts/release-version.sh next)"
          if [ -z "$tags" ]; then
            echo "nothing projects receive changed since the last release: nothing to tag"
            exit 0
          fi
          refs=""
          for t in $tags; do git tag "$t"; refs="$refs refs/tags/$t"; done
          git push origin $refs
          echo "released: $tags"
