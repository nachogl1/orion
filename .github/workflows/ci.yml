name: ci

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a pull request cancels its older run; every run on main gets a group of its own, so none is cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  bash-and-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (syntax check)
        run: bash -n orion.sh
      - name: One file (bash parses, Python compiles)
        run: |
          bash -n skills/clear-git-resources/scripts/scan.sh
          python3 -m py_compile skills/issue-map/scripts/issue_map.py skills/generate-project-writeup/assets/build_docx.py
      - name: Lint (every skill description carries the ORION prefix)
        run: |
          missing=$(grep -L -E '^description: ["'\'']?ORION - ' skills/*/SKILL.md || true)
          if [ -n "$missing" ]; then echo "missing ORION - prefix:"; echo "$missing"; exit 1; fi
      - name: Fetch main (the suite compares GLOBAL_CLAUDE.md's clause dates with origin/main)
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
      - name: Full suite (tests/run.sh)
        run: bash tests/run.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Typecheck (orion.ps1 parses under Windows PowerShell 5.1)
        shell: powershell
        run: '[scriptblock]::Create((Get-Content -Raw orion.ps1)) > $null'
      - name: Windows part of the suite under Git Bash (tests/run.sh --windows)
        shell: bash
        run: bash tests/run.sh --windows
