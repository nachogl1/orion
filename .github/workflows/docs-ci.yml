name: docs-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Structural markdown errors only (config: .markdownlint-cli2.jsonc).
      - name: Markdown lint
        run: npx -y markdownlint-cli2

      # Internal (relative) links are checked strictly - a broken cross-doc
      # link fails the build. Config excludes http(s) URLs.
      - name: Internal link check (blocking)
        run: |
          git ls-files '*.md' | while read -r f; do
            npx -y markdown-link-check -q -c .markdown-link-check.json "$f" || exit 1
          done

      # External links are checked too, but non-blocking: remote sites rate-limit
      # and flake, and a third-party outage must not block merging doc fixes.
      - name: External link check (non-blocking)
        continue-on-error: true
        run: |
          git ls-files '*.md' | while read -r f; do
            npx -y markdown-link-check -q "$f" || echo "::warning file=$f::broken external link(s) in $f"
          done
